name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: iag
          POSTGRES_PASSWORD: iag_dev
          POSTGRES_DB: iag_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iag -d iag_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # go.mod carries a meta-repo-only replace, which does not resolve in a
      # standalone checkout. This step used to fix that by cloning the meta-repo,
      # but that repo is private and a `run:` step carries no credentials, so
      # every run since this step was added has died with
      # "fatal: could not read Username for 'https://github.com'" before the
      # compiler was ever reached.
      #
      # Build against the committed snapshot instead, as the standalone
      # Dockerfile target does. Refresh it with scripts/sync-platform-go.sh.
      - name: Point platform-go at the vendored snapshot
        run: go mod edit -replace=github.com/alvor-technologies/iag-platform-go=./third_party/platform-go

      - name: go mod tidy
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test ./...
        env:
          DATABASE_URL: postgres://iag:iag_dev@localhost:5432/iag_platform?sslmode=disable

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (standalone target)
        run: docker build --target standalone -t iag-traceability:ci .
